<!DOCTYPE html>
<html lang="hi">
<head>
    <meta name="google-site-verification" content="eFYr2ywS5STRWx" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkari Aspirant Pro - Ultimate Exam Toolkit Hub</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --success: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-light: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 650px;
            width: 100%;
        }

        .header h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #818cf8 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.95rem;
            margin: 0;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }
        
        /* Modern Tabs Grid */
        .tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            margin-bottom: 25px;
            display: none;
            border: 1px solid var(--border);
        }

        .card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        input[type="file"], input[type="date"], input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-sizing: border-box;
            font-size: 0.95rem;
            background: #0f172a;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .preview-box {
            text-align: center;
            margin-top: 20px;
        }

        #preview {
            max-width: 100%;
            max-height: 220px;
            border-radius: 10px;
            border: 2px dashed var(--border);
            display: none;
            margin: 0 auto;
            padding: 4px;
            background: #0f172a;
        }

        .download-btn {
            display: none;
            background: var(--success);
            text-align: center;
            text-decoration: none;
            padding: 13px;
            color: white;
            border-radius: 10px;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .info-text {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 12px;
            font-weight: 600;
            color: #38bdf8;
        }
        
        .result-card {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            color: #818cf8;
            font-size: 1.1rem;
            display: none;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Sarkari Aspirant Pro</h1>
    <p>Ek hi platform par sabhi zaroori exam tools – 100% Secure & Free</p>
</div>

<div class="container">
    
    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('resizer', this)">📸 Photo & Sign Resizer</button>
        <button class="tab-btn" onclick="switchTab('ageCalc', this)">⏳ Advanced Age Calc</button>
        <button class="tab-btn" onclick="switchTab('nameTagger', this)">✍️ Photo Name & Date</button>
        <button class="tab-btn" onclick="switchTab('cgpaConv', this)">🎓 CGPA to % Converter</button>
    </div>

    <!-- TOOL 1: PHOTO RESIZER -->
    <div id="resizer" class="card active">
        <div class="form-group">
            <label>📷 Photo ya Signature Select Karein:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="form-group">
            <label>🎯 Target Max Size:</label>
            <select id="targetSize">
                <option value="20">Under 20 KB (Signatures)</option>
                <option value="50" selected>Under 50 KB (Photos)</option>
                <option value="100">Under 100 KB</option>
                <option value="200">Under 200 KB</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="processImage()">⚡ Fast Compress & Resize</button>
        <div class="preview-box">
            <img id="preview" alt="Preview">
            <div id="outputInfo" class="info-text"></div>
            <a id="downloadLink" class="download-btn" download="sarkari-resized.jpg">📥 Download Compressed File</a>
        </div>
    </div>

    <!-- TOOL 2: AGE CALCULATOR -->
    <div id="ageCalc" class="card">
        <div class="form-group">
            <label>📅 Date of Birth (Janm Tithi):</label>
            <input type="date" id="dob">
        </div>
        <div class="form-group">
            <label>🎯 Target Exam Date:</label>
            <input type="date" id="targetDate" value="2026-08-01">
        </div>
        <button class="btn btn-primary" onclick="calculateAge()">📊 Calculate Exact Age</button>
        <div id="ageResult" class="result-card"></div>
    </div>

    <!-- TOOL 3: PHOTO NAME & DATE STAMP (ADVANCE) -->
    <div id="nameTagger" class="card">
        <div class="form-group">
            <label>📸 Photo Upload Karein:</label>
            <input type="file" id="tagImageInput" accept="image/*">
        </div>
        <div class="form-group">
            <label>👤 Candidate ka Naam:</label>
            <input type="text" id="candidateName" placeholder="Jaise: RAHUL KUMAR">
        </div>
        <div class="form-group">
            <label>📅 Photo Khichwane ki Date:</label>
            <input type="date" id="photoDate">
        </div>
        <button class="btn btn-primary" onclick="addNameToImage()">✨ Name & Date Stamp Lagayein</button>
        <div class="preview-box">
            <img id="taggedPreview" alt="Tagged Preview">
            <a id="downloadTaggedLink" class="download-btn" download="sarkari-photo-with-name.jpg">📥 Download Stamped Photo</a>
        </div>
    </div>

    <!-- TOOL 4: CGPA TO PERCENTAGE -->
    <div id="cgpaConv" class="card">
        <div class="form-group">
            <label>🎓 Apna CGPA Score Dalein (e.g. 8.5):</label>
            <input type="text" id="cgpaInput" placeholder="Enter CGPA">
        </div>
        <button class="btn btn-primary" onclick="convertCgpa()">🔄 Percentage Nikalein</button>
        <div id="cgpaResult" class="result-card"></div>
    </div>

    <footer>
        <p>© 2026 Sarkari Aspirant Pro. Built for Students with 💻 & ❤️</p>
    </footer>
</div>

<script>
function switchTab(tabId, btn) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

// 1. Resizer Logic
function processImage() {
    const fileInput = document.getElementById('imageInput');
    const targetKB = parseInt(document.getElementById('targetSize').value);
    const preview = document.getElementById('preview');
    const downloadLink = document.getElementById('downloadLink');
    const outputInfo = document.getElementById('outputInfo');

    if (!fileInput.files[0]) {
        alert("Kripya pehle image select karein!");
        return;
    }
    outputInfo.innerText = "⏳ Processing...";

    const reader = new FileReader();
    reader.readAsDataURL(fileInput.files[0]);
    reader.onload = function (e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function () {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const maxD = 800;
            if (w > maxD || h > maxD) {
                if (w > h) { h = Math.round((h * maxD) / w); w = maxD; }
                else { w = Math.round((w * maxD) / h); h = maxD; }
            }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            let q = 0.9, dataUrl = canvas.toDataURL('image/jpeg', q);
            while (dataUrl.length * 3 / 4 / 1024 > targetKB && q > 0.05) {
                q -= 0.05; dataUrl = canvas.toDataURL('image/jpeg', q);
            }
            const size = Math.round(dataUrl.length * 3 / 4 / 1024);
            preview.src = dataUrl; preview.style.display = 'block';
            downloadLink.href = dataUrl; downloadLink.style.display = 'block';
            outputInfo.innerText = `✨ Done! Final Size: ~${size} KB`;
        }
    }
}

// 2. Age Calculator
function calculateAge() {
    const dob = new Date(document.getElementById('dob').value);
    const target = new Date(document.getElementById('targetDate').value);
    const res = document.getElementById('ageResult');
    if (isNaN(dob) || isNaN(target)) { alert("Dono dates select karein!"); return; }
    
    let y = target.getFullYear() - dob.getFullYear();
    let m = target.getMonth() - dob.getMonth();
    let d = target.getDate() - dob.getDate();
    if (d < 0) { m--; d += new Date(target.getFullYear(), target.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }

    const diffTime = Math.abs(target - dob);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    res.style.display = 'block';
    res.innerHTML = `🎉 Exact Age: ${y} Saal, ${m} Mahine, ${d} Din<br><small style="color:#94a3b8">Total Lived: ~${diffDays} Din</small>`;
}

// 3. Photo Name & Date Stamp
function addNameToImage() {
    const fileInput = document.getElementById('tagImageInput');
    const name = document.getElementById('candidateName').value.toUpperCase();
    const dateInput = document.getElementById('photoDate').value;
    const preview = document.getElementById('taggedPreview');
    const downloadLink = document.getElementById('downloadTaggedLink');

    if (!fileInput.files[0] || !name || !dateInput) {
        alert("Kripya Photo, Naam aur Date sabhi bharein!");
        return;
    }

    const reader = new FileReader();
    reader.readAsDataURL(fileInput.files[0]);
    reader.onload = function (e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function () {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height + 60; // Extra space for text strip
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            // Black strip background for text readability
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, img.height, canvas.width, 60);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold " + Math.max(16, Math.floor(canvas.width / 25)) + "px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(name, canvas.width / 2, img.height + 25);
            ctx.fillText("DOP: " + dateInput, canvas.width / 2, img.height + 50);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            preview.src = dataUrl; preview.style.display = 'block';
            downloadLink.href = dataUrl; downloadLink.style.display = 'block';
        }
    }
}

// 4. CGPA Converter
function convertCgpa() {
    const cgpa = parseFloat(document.getElementById('cgpaInput').value);
    const res = document.getElementById('cgpaResult');
    if (isNaN(cgpa)) { alert("Sahi CGPA dalein!"); return; }
    const percentage = (cgpa * 9.5).toFixed(2);
    res.style.display = 'block';
    res.innerText = `🎓 Estimated Percentage: ${percentage}% (Multiplier: 9.5)`;
}
</script>
</body>
</html>
